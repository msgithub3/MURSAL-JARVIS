name: MURSAL JARVIS Backend & Cloud Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Node & Python Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Test Suite
        run: |
          python3 scripts/run_all_tests.py
